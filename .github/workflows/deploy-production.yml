name: Deploy production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Component or operation to deploy
        required: true
        type: choice
        default: frontend
        options:
          - frontend
          - backend
          - infrastructure
          - restart-api
          - restart-stack
          - reload-nginx
          - all

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - adwais-prod
    environment: production
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: adwais
      ADWAIS_CONFIG_DIR: /opt/adwais
      ADWAIS_ENV_FILE: /opt/adwais/.env

    steps:
      - name: Require main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [[ "$DEPLOY_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must run from main; selected ref was $DEPLOY_REF." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify runner prerequisites
        run: |
          docker version
          docker compose version
          compose_version="$(docker compose version --short | sed 's/^v//')"
          if ! dpkg --compare-versions "$compose_version" ge "2.33.1"; then
            echo "Docker Compose 2.33.1 or newer is required; found $compose_version." >&2
            exit 1
          fi
          test -w "$ADWAIS_CONFIG_DIR" || {
            echo "$ADWAIS_CONFIG_DIR does not exist or is not writable by the runner user." >&2
            echo "Create it once using the server setup commands in the deployment documentation." >&2
            exit 1
          }

      - name: Write production configuration
        if: inputs.target == 'backend' || inputs.target == 'infrastructure' || inputs.target == 'all'
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_SCOPE: ${{ vars.OIDC_SCOPE || 'openid profile email' }}
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          SSO_BUTTON_LABEL: ${{ vars.SSO_BUTTON_LABEL || 'Sign in with SSO' }}
          SSO_BUTTON_LOGO_URL: ${{ vars.SSO_BUTTON_LOGO_URL }}
          MOTASTIC_API_KEY: ${{ secrets.MOTASTIC_API_KEY }}
          NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}
          KIOSK_JWT_SECRET: ${{ secrets.KIOSK_JWT_SECRET }}
          ENABLE_RUNTIME_DATA_SEEDING: ${{ vars.ENABLE_RUNTIME_DATA_SEEDING || 'true' }}
          RESEED: ${{ vars.RESEED || 'false' }}
          CLOUDFLARED_IMAGE_TAG: ${{ vars.CLOUDFLARED_IMAGE_TAG || 'latest' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          required=(
            DB_PASSWORD
            MOTASTIC_API_KEY
            NEWSLETTER_API_KEY
            KIOSK_JWT_SECRET
            CLOUDFLARE_TUNNEL_TOKEN
          )
          if [[ "$DEMO_MODE" != "true" ]]; then
            required+=(OIDC_AUTHORITY OIDC_AUDIENCE OIDC_CLIENT_ID)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required production secret or variable $name is missing." >&2
              exit 1
            fi
          done

          umask 077

          write_dotenv() {
            local key="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$key cannot contain a newline." >&2
              exit 1
            fi
            value="${value//\\/\\\\}"
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$key" "$value"
          }

          {
            write_dotenv DB_PASSWORD "$DB_PASSWORD"
            write_dotenv OIDC_AUTHORITY "$OIDC_AUTHORITY"
            write_dotenv OIDC_AUDIENCE "$OIDC_AUDIENCE"
            write_dotenv OIDC_CLIENT_ID "$OIDC_CLIENT_ID"
            write_dotenv OIDC_SCOPE "$OIDC_SCOPE"
            write_dotenv DEMO_MODE "$DEMO_MODE"
            write_dotenv SSO_BUTTON_LABEL "$SSO_BUTTON_LABEL"
            write_dotenv SSO_BUTTON_LOGO_URL "$SSO_BUTTON_LOGO_URL"
            write_dotenv MOTASTIC_API_KEY "$MOTASTIC_API_KEY"
            write_dotenv NEWSLETTER_API_KEY "$NEWSLETTER_API_KEY"
            write_dotenv KIOSK_JWT_SECRET "$KIOSK_JWT_SECRET"
            write_dotenv ENABLE_RUNTIME_DATA_SEEDING "$ENABLE_RUNTIME_DATA_SEEDING"
            write_dotenv RESEED "$RESEED"
            write_dotenv CLOUDFLARED_IMAGE_TAG "$CLOUDFLARED_IMAGE_TAG"
            write_dotenv CLOUDFLARE_TUNNEL_TOKEN "$CLOUDFLARE_TUNNEL_TOKEN"
          } > "$ADWAIS_ENV_FILE"

          chmod 600 "$ADWAIS_ENV_FILE"

      - name: Validate production configuration
        run: |
          test -s "$ADWAIS_ENV_FILE" || {
            echo "$ADWAIS_ENV_FILE is missing. Run the all or infrastructure target first." >&2
            exit 1
          }
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml config --quiet

      - name: Deploy frontend
        if: inputs.target == 'frontend'
        run: |
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml build web
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml up -d --no-deps web

      - name: Deploy backend
        if: inputs.target == 'backend'
        run: |
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml build api
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml up -d --no-deps api

      - name: Apply infrastructure
        if: inputs.target == 'infrastructure'
        run: |
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml pull db cloudflared
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml up -d --no-build --remove-orphans
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml up -d --no-deps --force-recreate cloudflared

      - name: Deploy complete stack
        if: inputs.target == 'all'
        run: |
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml pull db cloudflared
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml build api web
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml up -d --no-deps --force-recreate cloudflared

      - name: Restart API
        if: inputs.target == 'restart-api'
        run: docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml restart api

      - name: Restart stack
        if: inputs.target == 'restart-stack'
        run: docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml restart

      - name: Validate and reload nginx
        if: inputs.target == 'reload-nginx'
        run: |
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml exec -T web nginx -t
          docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml exec -T web nginx -s reload

      - name: Show deployment status
        if: always()
        run: docker compose --env-file "$ADWAIS_ENV_FILE" -f docker-compose.prod.yml ps || true
