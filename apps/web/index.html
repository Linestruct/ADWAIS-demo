<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ADWAIS" />
    <title>ADWAIS</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8fafc; }
      #app-boot-loader { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; color: #022d2e; font-family: Manrope, system-ui, sans-serif; }
      #app-boot-card { box-sizing: border-box; width: 100%; max-width: 42rem; min-height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1.5rem; background: #f1f5f9; box-shadow: 0 0 60px rgba(0,0,0,.08); text-align: center; }
      #app-boot-card h1 { margin: 0; font-size: 1.5rem; line-height: 2rem; }
      #app-boot-card p { max-width: 28rem; margin: 0; color: #475569; font-size: .875rem; font-weight: 600; line-height: 1.625; }
      #app-boot-loader span { width: 2rem; height: 2rem; border: 3px solid #cbd5e1; border-top-color: #06959b; border-radius: 999px; animation: app-boot-spin .8s linear infinite; }
      @media (min-width: 640px) { #app-boot-card { min-height: 590px; padding: 3rem; border-radius: 2rem; } }
      @media (min-width: 768px) { #app-boot-card { padding: 5rem; } }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-loader" role="status" aria-label="Loading ADWAIS">
        <div id="app-boot-card">
          <h1>Loading ADWAIS</h1>
          <p>Starting the application.</p>
          <span aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
